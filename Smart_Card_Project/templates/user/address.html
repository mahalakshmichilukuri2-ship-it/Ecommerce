
<!DOCTYPE html>
<html>
<head>
    <title>Delivery Address</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .address-container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

<div class="address-container">

    <h2>Delivery Address</h2>

    <form action="/user/save-address" method="POST">

        <label>Full Name:</label>
        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >

        <label>Phone Number:</label>
        <input
            type="tel"
            name="phone"
            placeholder="Enter your phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >

        <label>Delivery Address:</label>
        <textarea
            name="address"
            placeholder="Enter your complete delivery address"
            required
        ></textarea>

        <button type="submit">Proceed to Order</button>

    </form>

</div>

</body>
</html>
