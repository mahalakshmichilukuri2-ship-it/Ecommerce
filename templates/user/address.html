{% extends "base.html" %}

{% block title %}Delivery Address | SmartCart{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/address.css') }}">
{% endblock %}

{% block content %}

<div class="address-page">

    <div class="address-container">

        <h2>Delivery Details</h2>

        <form action="/user/save-address" method="POST">

            <div class="address-form-grid">

                <!-- Full Name -->
                <div class="address-form-group">
                    <label>Full Name:</label>
                    <input type="text" name="name" placeholder="Enter your full name" required>
                </div>

                <!-- Email -->
                <div class="address-form-group">
                    <label>Email:</label>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>

                <!-- Phone Number -->
                <div class="address-form-group">
                    <label>Phone Number:</label>
                    <input type="tel" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}"
                        maxlength="10" required>
                </div>

                <!-- Door Number -->
                <div class="address-form-group">
                    <label>Door No:</label>
                    <input type="text" name="door_no" placeholder="Enter your door number" required>
                </div>

                <!-- Delivery Address -->
                <div class="address-form-group full-width">
                    <label>Address (Street / Area):</label>
                    <textarea name="address" placeholder="Enter your complete delivery address" required></textarea>
                </div>

                <!-- City -->
                <div class="address-form-group">
                    <label>City:</label>
                    <input type="text" name="city" placeholder="Enter your city" required>
                </div>

                <!-- Pincode -->
                <div class="address-form-group">
                    <label>Pincode:</label>
                    <input type="text" name="pincode" placeholder="Enter your pincode" pattern="[0-9]{6}" maxlength="6"
                        required>
                </div>

            </div>

            <div class="address-actions">

                <a href="/user/cart" class="back-cart-btn">
                    ← Back to Cart
                </a>

                <button type="submit">
                    Proceed to Order →
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
